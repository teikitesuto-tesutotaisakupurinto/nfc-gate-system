<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>
端末登録
</title>

</head>


<body>


<h1>
肩叩き定期券システム
</h1>


<h2>
端末登録
</h2>


<div>


<label>
端末ID
</label>

<br>

<input id="deviceId"
placeholder="例: service001">


<br><br>



<label>
端末名
</label>

<br>

<input id="deviceName"
placeholder="例: サービス利用端末1">


<br><br>



<label>
端末種類
</label>

<br>


<select id="deviceType">


<option value="office">

窓口端末

</option>


<option value="service">

サービス利用端末

</option>


</select>


<br><br>



<label>
状態
</label>

<br>


<select id="status">


<option value="active">

利用可能

</option>


<option value="inactive">

停止

</option>


</select>



<br><br>



<button id="register">

登録

</button>


</div>



<hr>


<h2>
登録済み端末
</h2>


<div id="deviceList">

</div>



<script type="module" src="device.js"></script>


</body>


</html>
